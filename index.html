<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fotis | Οι Εργασίες μου</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #4338ca 0%, transparent 35%),
                radial-gradient(circle at bottom right, #7c3aed 0%, transparent 35%),
                #090d1a;
        }

        header {
            text-align: center;
            padding: 65px 20px 35px;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        .subtitle {
            color: #b8c0d9;
            font-size: 18px;
            margin-top: 12px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 0 20px 50px;
        }

        .topbar {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search {
            flex: 1;
            padding: 17px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.08);
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search::placeholder {
            color: #9ca3b8;
        }

        .new-folder {
            padding: 0 20px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .new-folder:hover {
            transform: translateY(-2px);
            opacity: .9;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
        }

        .card {
            padding: 25px;
            min-height: 180px;
            border-radius: 22px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.12);
            transition: .25s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,.13);
        }

        .icon {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .card p {
            margin: 0;
            color: #aeb6ce;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3b8;
            border: 1px dashed rgba(255,255,255,.15);
            border-radius: 22px;
            grid-column: 1 / -1;
        }

        .loading {
            text-align: center;
            color: #b8c0d9;
            padding: 40px;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            color: #737c96;
            padding: 25px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 32px;
            }

            header {
                padding-top: 45px;
            }

            .topbar {
                flex-direction: column;
            }

            .new-folder {
                height: 52px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">📚</div>
    <h1>Οι Εργασίες μου</h1>
    <div class="subtitle">
        Ο προσωπικός χώρος του Fotis
    </div>
</header>

<div class="container">

    <div class="topbar">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔎 Αναζήτηση φακέλου..."
        >

        <button
            id="newFolderButton"
            class="new-folder"
        >
            ＋ Νέος φάκελος
        </button>

    </div>

    <div id="folders" class="cards">
        <div class="loading">
            Φόρτωση φακέλων...
        </div>
    </div>

</div>

<footer>
    Fotis • Προσωπικός χώρος εργασιών
</footer>

<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://maacexxvxsdiyjokytrd.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_oM8wDIoRdcueH4Vvb3fO7w_hh16_xTO";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================
    // ΑΣΦΑΛΕΙΑ HTML
    // ==========================================

    function escapeHtml(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    // ==========================================
    // ΦΟΡΤΩΣΗ ΦΑΚΕΛΩΝ
    // ==========================================

    async function loadFolders() {

        const foldersContainer =
            document.getElementById("folders");

        foldersContainer.innerHTML = `
            <div class="loading">
                Φόρτωση φακέλων...
            </div>
        `;

        const { data, error } =
            await supabaseClient
                .from("folders")
                .select("*")
                .is("parent_id", null)
                .order("name", { ascending: true });


        if (error) {

            console.error("Supabase error:", error);

            foldersContainer.innerHTML = `
                <div class="empty">
                    ❌ Δεν ήταν δυνατή η φόρτωση των φακέλων.
                    <br><br>
                    Έλεγξε τις ρυθμίσεις του Supabase.
                </div>
            `;

            return;
        }


        if (!data || data.length === 0) {

            foldersContainer.innerHTML = `
                <div class="empty">
                    📁 Δεν υπάρχουν ακόμα φάκελοι.
                    <br><br>
                    Πάτησε «＋ Νέος φάκελος» για να δημιουργήσεις τον πρώτο.
                </div>
            `;

            return;
        }


        renderFolders(data);
    }


    // ==========================================
    // ΕΜΦΑΝΙΣΗ ΦΑΚΕΛΩΝ
    // ==========================================

    function renderFolders(folders) {

        const container =
            document.getElementById("folders");

        container.innerHTML = "";


        folders.forEach(folder => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.dataset.name =
                folder.name.toLowerCase();


            card.innerHTML = `

                <div class="icon">
                    📁
                </div>

                <h2>
                    ${escapeHtml(folder.name)}
                </h2>

                <p>
                    Φάκελος εργασιών
                </p>

            `;


            card.addEventListener("click", () => {

                alert(
                    "Ο φάκελος «" +
                    folder.name +
                    "» θα ανοίγει εδώ στο επόμενο βήμα."
                );

            });


            container.appendChild(card);

        });
    }


    // ==========================================
    // ΑΝΑΖΗΤΗΣΗ
    // ==========================================

    document
        .getElementById("search")
        .addEventListener("input", function () {

            const searchText =
                this.value
                    .toLowerCase()
                    .trim();

            const cards =
                document.querySelectorAll(".card");


            cards.forEach(card => {

                const name =
                    card.dataset.name || "";

                if (name.includes(searchText)) {
                    card.style.display = "";
                } else {
                    card.style.display = "none";
                }

            });

        });


    // ==========================================
    // ΔΗΜΙΟΥΡΓΙΑ ΝΕΟΥ ΦΑΚΕΛΟΥ
    // ==========================================

    document
        .getElementById("newFolderButton")
        .addEventListener("click", async function () {

            const email =
                prompt(
                    "✉️ Βάλε το email του λογαριασμού σου στο Supabase:"
                );


            if (!email) {
                return;
            }


            const password =
                prompt(
                    "🔐 Βάλε τον κωδικό του λογαριασμού σου:"
                );


            if (!password) {
                return;
            }


            const { error: loginError } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email: email,
                        password: password
                    });


            if (loginError) {

                alert(
                    "❌ Λάθος email ή κωδικός."
                );

                return;
            }


            const folderName =
                prompt(
                    "📁 Πώς θέλεις να ονομάζεται ο νέος φάκελος;"
                );


            if (!folderName || !folderName.trim()) {

                await supabaseClient.auth.signOut();

                return;
            }


            const { error } =
                await supabaseClient
                    .from("folders")
                    .insert({
                        name: folderName.trim(),
                        parent_id: null
                    });


            await supabaseClient.auth.signOut();


            if (error) {

                console.error("Insert error:", error);

                alert(
                    "❌ Δεν δημιουργήθηκε ο φάκελος."
                );

                return;
            }


            alert(
                "✅ Ο φάκελος δημιουργήθηκε!"
            );


            await loadFolders();

        });


    // ==========================================
    // ΕΚΚΙΝΗΣΗ
    // ==========================================

    loadFolders();

</script>

</body>
</html>
